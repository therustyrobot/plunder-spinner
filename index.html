<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plunder — Compass Spinners</title>
<style>
  :root{
    --parchment:#e8d5a8;
    --parchment-dark:#c9a96b;
    --ink:#2b1a0e;
    --wood:#3e2417;
    --wood-dark:#241209;
    --gold:#d4af37;
    --red:#8b1e1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0;
    width:100vw; height:100vh; height:100dvh;
    overflow:hidden;
    background: radial-gradient(ellipse at center, #1a3a4a 0%, #0a1a22 100%);
    font-family:'Georgia', 'Palatino', serif;
    overscroll-behavior:none;
  }
  /* Whole UI pre-rotated 90deg so the page reads correctly with the
     phone lying flat on a table, long edge toward the viewer (down). */
  #rotateWrap{
    position:fixed;
    top:0; left:0;
    width:100vh; width:100dvh;
    height:100vw;
    transform-origin: top left;
    transform: rotate(90deg) translateY(-100%);
    overflow:hidden;
  }
  #stage{
    width:100%; height:100%;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:2vmin;
    padding:1.5vmin;
    touch-action:none;
  }
  .titleCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2vmin;
    flex:0 0 auto;
  }
  h1{
    color:var(--gold);
    font-size:5.2vmin;
    letter-spacing:0.3vmin;
    text-transform:uppercase;
    margin:0;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    text-shadow: 0 0 10px rgba(212,175,55,0.6), 2px 2px 0 #000;
  }
  .wheelsCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    gap:1vmin;
  }
  #result{
    color:#fff;
    font-size:5.6vmin;
    font-weight:bold;
    min-height:1.2em;
    letter-spacing:0.2vmin;
    text-shadow: 0 0 12px rgba(255,255,255,0.5), 2px 2px 2px #000;
    flex:0 0 auto;
  }
  #wheels{
    display:flex;
    flex-direction:row;
    gap:2.5vmin;
    justify-content:center;
    align-items:center;
  }
  .wheelGroup{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    justify-content:center;
  }
  .wheelBox{
    position:relative;
    width:min(78vmin, 42vmax);
    max-width:440px;
    aspect-ratio:1/1;
    touch-action:none;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    cursor:pointer;
  }
  .label{
    text-align:center;
    color:var(--parchment);
    font-size:2.6vmin;
    letter-spacing:0.3vmin;
    margin-top:0.8vmin;
    text-transform:uppercase;
    opacity:0.85;
  }
  #hint{
    color:var(--parchment-dark);
    font-size:2vmin;
    opacity:0.7;
    letter-spacing:0.2vmin;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  #muteBtn{
    position:absolute;
    top:1.5vmin;
    right:1.5vmin;
    background:rgba(0,0,0,0.4);
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:50%;
    width:4.6vmin;
    height:4.6vmin;
    font-size:2.2vmin;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
</style>
</head>
<body>
<div id="rotateWrap">
  <div id="stage">
    <button id="muteBtn">🔊</button>
    <div class="titleCol">
      <h1>Plunder</h1>
      <div id="hint">Tap or flick to spin</div>
    </div>
    <div class="wheelsCol">
      <div id="result">&nbsp;</div>
      <div id="wheels">
        <div class="wheelGroup">
          <div class="wheelBox">
            <canvas id="wheelNum"></canvas>
          </div>
          <div class="label">Numbers</div>
        </div>
        <div class="wheelGroup">
          <div class="wheelBox">
            <canvas id="wheelLet"></canvas>
          </div>
          <div class="label">Letters</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Audio ----------
  let audioCtx = null;
  let muted = false;
  let audioUnlocked = false;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(!audioUnlocked){
      // iOS Safari/WKWebView: must play a real buffer inside the gesture handler
      // to unlock the context, resume() alone is not always enough.
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      audioUnlocked = true;
    }
  }
  function tick(){
    if(muted || !audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = 900 + Math.random()*80;
    g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.start(t);
    o.stop(t + 0.06);
  }
  function clunk(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    // low thud
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.3);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.4);
    // bright chime on top
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = 660;
    g2.gain.setValueAtTime(0.15, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t); o2.stop(t + 0.5);
  }

  // ---------- Wheel class ----------
  function Wheel(canvasId, segments, colorsA, colorsB){
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.segments = segments; // array of labels
    this.n = segments.length;
    this.angle = 0;           // current rotation, radians
    this.vel = 0;             // angular velocity rad/s
    this.spinning = false;
    this.lastTickSeg = -1;
    this.colorsA = colorsA;
    this.colorsB = colorsB;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.draw();
    this.bindInput();
  }

  Wheel.prototype.resize = function(){
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.size = rect.width;
    this.buildDisk(dpr);
    this.draw();
  };

  // Renders the static weathered-wood disc + labels once into an offscreen
  // canvas. It never needs to be redrawn per animation frame since the
  // disc itself no longer rotates (the arrow needle does).
  Wheel.prototype.buildDisk = function(dpr){
    const s = this.size;
    const r = s/2;
    const cx = r, cy = r;

    const disk = document.createElement('canvas');
    disk.width = this.canvas.width;
    disk.height = this.canvas.height;
    const ctx = disk.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    this.diskCanvas = disk;

    // outer weathered plank rim
    ctx.beginPath();
    ctx.arc(cx,cy,r-2,0,Math.PI*2);
    ctx.fillStyle = '#4a3421';
    ctx.fill();

    const segAngle = (Math.PI*2)/this.n;
    for(let i=0;i<this.n;i++){
      const start = i*segAngle - Math.PI/2;
      const end = start + segAngle;
      const mid = start + segAngle/2;
      const base = i % 2 === 0 ? this.colorsA : this.colorsB;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy, r-8, start, end);
      ctx.closePath();
      ctx.clip();

      // weathered wood base: radial gradient, lighter near hub, dulled at rim
      const grad = ctx.createRadialGradient(cx,cy, r*0.1, cx,cy, r);
      grad.addColorStop(0, base.light);
      grad.addColorStop(0.7, base.mid);
      grad.addColorStop(1, base.dark);
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,s,s);

      // wood grain: streaks running roughly radial, jittered
      const grainCount = 6 + Math.floor(Math.random()*3);
      for(let g=0; g<grainCount; g++){
        const jitter = (Math.random()-0.5) * segAngle * 0.7;
        const a = mid + jitter;
        const r0 = r*(0.12 + Math.random()*0.15);
        const r1 = r*(0.75 + Math.random()*0.22);
        const wob = (Math.random()-0.5) * segAngle * 0.35;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0);
        ctx.quadraticCurveTo(
          cx + Math.cos(a+wob)*(r0+r1)/2, cy + Math.sin(a+wob)*(r0+r1)/2,
          cx + Math.cos(a)*r1, cy + Math.sin(a)*r1
        );
        ctx.strokeStyle = Math.random() > 0.5
          ? 'rgba(40,25,12,' + (0.15 + Math.random()*0.18) + ')'
          : 'rgba(210,180,130,' + (0.10 + Math.random()*0.12) + ')';
        ctx.lineWidth = Math.max(0.6, r*0.006*(1+Math.random()));
        ctx.stroke();
      }

      // occasional knot
      if(Math.random() < 0.35){
        const ka = mid + (Math.random()-0.5)*segAngle*0.5;
        const kr = r*(0.35 + Math.random()*0.35);
        const kx = cx + Math.cos(ka)*kr, ky = cy + Math.sin(ka)*kr;
        const knotR = r*(0.045 + Math.random()*0.03);
        const kgrad = ctx.createRadialGradient(kx,ky,0, kx,ky,knotR*2.2);
        kgrad.addColorStop(0, 'rgba(30,18,8,0.55)');
        kgrad.addColorStop(0.5, 'rgba(30,18,8,0.25)');
        kgrad.addColorStop(1, 'rgba(30,18,8,0)');
        ctx.fillStyle = kgrad;
        ctx.beginPath();
        ctx.arc(kx,ky,knotR*2.2,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(kx,ky,knotR*0.4,0,Math.PI*2);
        ctx.fillStyle = 'rgba(20,12,5,0.6)';
        ctx.fill();
      }

      ctx.restore();

      // plank seam between segments
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(cx + Math.cos(start)*(r-8), cy + Math.sin(start)*(r-8));
      ctx.strokeStyle = 'rgba(25,15,6,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // label — clock style: upright, all facing the same way
      const labelR = r * 0.68;
      ctx.save();
      ctx.translate(cx + Math.cos(mid)*labelR, cy + Math.sin(mid)*labelR);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(30,18,8,0.88)';
      ctx.font = 'bold ' + Math.max(13, r*0.18) + 'px Georgia, serif';
      ctx.fillText(this.segments[i], 0, 0);
      ctx.restore();
    }

    // rim ring
    ctx.beginPath();
    ctx.arc(cx,cy, r-2, 0, Math.PI*2);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#1f1309';
    ctx.stroke();
  };

  Wheel.prototype.draw = function(){
    const ctx = this.ctx;
    const s = this.size;
    const r = s/2;
    const cx = r, cy = r;
    ctx.clearRect(0,0,s,s);

    // blit the cached weathered-wood disc 1:1 in device pixels
    if(this.diskCanvas){
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(this.diskCanvas, 0, 0);
      ctx.restore();
    }

    // spinning arrow — balanced length both sides of the hub, one end a
    // classic arrowhead, the other a classic feather/fletching tail
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(this.angle);
    const halfLen = r*0.66;
    const shaftW = r*0.035;
    const headLen = r*0.20, headW = r*0.15;
    const finLen = r*0.20, finW = r*0.17, finInset = r*0.11;

    ctx.fillStyle = '#0a0a0a';
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;

    // shaft
    ctx.beginPath();
    ctx.rect(-shaftW/2, -halfLen+headLen*0.55, shaftW, halfLen*2 - headLen*0.55 - finLen*0.55);
    ctx.fill();
    ctx.stroke();

    // arrowhead
    ctx.beginPath();
    ctx.moveTo(0, -halfLen);
    ctx.lineTo(headW/2, -halfLen+headLen);
    ctx.lineTo(-headW/2, -halfLen+headLen);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // fletching (single classic feather fan at the tail)
    ctx.beginPath();
    ctx.moveTo(0, halfLen-finLen);
    ctx.lineTo(finW/2, halfLen);
    ctx.lineTo(shaftW/2, halfLen-finInset);
    ctx.lineTo(0, halfLen-finLen*0.35);
    ctx.lineTo(-shaftW/2, halfLen-finInset);
    ctx.lineTo(-finW/2, halfLen);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // hub
    ctx.beginPath();
    ctx.arc(cx,cy, r*0.1, 0, Math.PI*2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  };

  Wheel.prototype.currentIndexAtPointer = function(){
    // the needle tip is the pointer now; disc is fixed at angle 0
    const segAngle = (Math.PI*2)/this.n;
    let a = this.angle % (Math.PI*2);
    a = ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    let idx = Math.floor(a/segAngle);
    idx = ((idx % this.n) + this.n) % this.n;
    return idx;
  };

  Wheel.prototype.spinWithVelocity = function(v){
    ensureAudio();
    if(this.spinning && Math.abs(this.vel) > Math.abs(v)) return;
    this.vel = v;
    this.spinning = true;
    if(!this._raf) this._raf = requestAnimationFrame((t)=>this.step(t));
  };

  Wheel.prototype.spinRandom = function(){
    // tap: fast burst spin
    const dir = 1;
    const v = (16 + Math.random()*8) * dir;
    this.spinWithVelocity(v);
  };

  Wheel.prototype.step = function(now){
    if(this._lastT === undefined) this._lastT = now;
    const dt = Math.min(0.05, (now - this._lastT)/1000);
    this._lastT = now;

    if(Math.abs(this.vel) > 0.001){
      this.angle += this.vel * dt;
      // friction
      const friction = 1.6; // rad/s^2 base decel; stronger at high speed, tapers out fast
      const sign = this.vel > 0 ? 1 : -1;
      let mag = Math.abs(this.vel);
      mag -= friction * (1 + mag*0.35) * dt;
      if(mag < 0) mag = 0;
      this.vel = sign * mag;

      const idx = this.currentIndexAtPointer();
      if(idx !== this.lastTickSeg){
        this.lastTickSeg = idx;
        tick();
      }
      this._raf = requestAnimationFrame((t)=>this.step(t));
    } else {
      this.vel = 0;
      this.spinning = false;
      this._raf = null;
      this._lastT = undefined;
      clunk();
      this.onStop && this.onStop(this.segments[this.currentIndexAtPointer()]);
    }
    this.draw();
  };

  Wheel.prototype.bindInput = function(){
    const el = this.canvas;
    let dragging = false;
    let lastAngle = 0;
    let lastTime = 0;
    let velSamples = [];
    let startX=0, startY=0, moved=false;
    const rectCenter = () => {
      const r = el.getBoundingClientRect();
      return {x:r.left+r.width/2, y:r.top+r.height/2};
    };
    const angleAt = (x,y) => {
      const c = rectCenter();
      return Math.atan2(y-c.y, x-c.x);
    };

    const down = (x,y) => {
      ensureAudio();
      dragging = true;
      moved = false;
      startX=x; startY=y;
      lastAngle = angleAt(x,y);
      lastTime = performance.now();
      velSamples = [];
      // stop momentum while dragging
      this.vel = 0;
    };
    const move = (x,y) => {
      if(!dragging) return;
      if(Math.abs(x-startX) > 4 || Math.abs(y-startY) > 4) moved = true;
      const now = performance.now();
      const a = angleAt(x,y);
      let d = a - lastAngle;
      // normalize delta to [-PI,PI]
      if(d > Math.PI) d -= Math.PI*2;
      if(d < -Math.PI) d += Math.PI*2;
      this.angle += d;
      const dt = Math.max(1, now-lastTime);
      velSamples.push({v: d/(dt/1000), t: now});
      if(velSamples.length > 6) velSamples.shift();
      lastAngle = a;
      lastTime = now;
      this.draw();
    };
    const up = () => {
      if(!dragging) return;
      dragging = false;
      if(!moved){
        // treat as tap
        this.spinRandom();
        return;
      }
      // compute average recent velocity for flick
      let avg = 0;
      if(velSamples.length){
        avg = velSamples.reduce((s,o)=>s+o.v,0)/velSamples.length;
      }
      if(Math.abs(avg) < 0.5){
        this.spinRandom();
      } else {
        // amplify flick a bit so short flicks still feel good
        const boosted = avg * 1.8;
        this.spinWithVelocity(Math.max(-34, Math.min(34, boosted)));
      }
    };

    el.addEventListener('mousedown', e => down(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
    window.addEventListener('mouseup', up);

    el.addEventListener('touchstart', e => {
      const t = e.touches[0];
      down(t.clientX, t.clientY);
    }, {passive:true});
    el.addEventListener('touchmove', e => {
      const t = e.touches[0];
      move(t.clientX, t.clientY);
    }, {passive:true});
    el.addEventListener('touchend', up);
  };

  // ---------- Setup ----------
  const numSegments = [];
  for(let i=1;i<=18;i++) numSegments.push(String(i));
  const letSegments = ['A','B','C','D','E','F','G','H','I','J','K','L'];

  // weathered wood tone pairs: light oak for numbers, darker walnut for letters
  const oakA   = { light:'#c9a877', mid:'#a8875a', dark:'#7c6340' };
  const oakB   = { light:'#b89760', mid:'#96774a', dark:'#6b5432' };
  const walnutA = { light:'#8a6b45', mid:'#6f5636', dark:'#4a3722' };
  const walnutB = { light:'#7a5d3a', mid:'#5f492c', dark:'#3d2d1a' };

  const wheelNum = new Wheel('wheelNum', numSegments, oakA, oakB);
  const wheelLet = new Wheel('wheelLet', letSegments, walnutA, walnutB);

  const resultEl = document.getElementById('result');
  let lastNum = null, lastLet = null;
  function updateResult(){
    if(lastNum !== null && lastLet !== null){
      resultEl.textContent = lastLet + ' – ' + lastNum;
    } else if(lastNum !== null){
      resultEl.textContent = lastNum;
    } else if(lastLet !== null){
      resultEl.textContent = lastLet;
    }
  }
  wheelNum.onStop = (label) => { lastNum = label; updateResult(); };
  wheelLet.onStop = (label) => { lastLet = label; updateResult(); };

  // mute toggle
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // prevent pinch-zoom only; page scroll (fallback if content overflows) stays enabled
  document.addEventListener('gesturestart', e => e.preventDefault());

})();
</script>
</body>
</html>
